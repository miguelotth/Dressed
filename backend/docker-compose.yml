services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: lookloop
      POSTGRES_PASSWORD: lookloop_dev_password
      POSTGRES_DB: lookloop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lookloop -d lookloop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
